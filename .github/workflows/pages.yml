name: Deploy Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - name: Install Node dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Deploy to srijanshetty.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::PAGES_DEPLOY_TOKEN secret is not set. Create a fine-grained PAT with contents:read/write on srijanshetty/srijanshetty.github.io and add it as an Actions secret."
            exit 1
          fi
          git clone --depth 1 --branch master \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/srijanshetty/srijanshetty.github.io.git" /tmp/deploy
          rsync -a --delete --exclude .git _site/ /tmp/deploy/
          cd /tmp/deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "deploy: srijanshetty/minimal-mistakes@${GITHUB_SHA:0:10}"
          git push origin master
